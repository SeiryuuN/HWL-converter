        async function convertAudioToHWL(audioFile) {
          const MAX_SAFE_SIZE = 500 * 1024 * 1024
          if (audioFile.size > MAX_SAFE_SIZE) {
            throw new Error(
              `File is too large (${(audioFile.size / 1024 / 1024).toFixed(1)}MB). Browsers cannot decompress files this large into RAM. Please use a shorter file or lower bitrate.`,
            )
          }

          if (audioFile.size === 0) {
            throw new Error("File is empty (0 bytes).")
          }

          const audioContext = new (
            window.AudioContext || window.webkitAudioContext
          )()

          let arrayBuffer
          try {
            arrayBuffer = await new Promise((resolve, reject) => {
              const reader = new FileReader()
              reader.onload = () => resolve(reader.result)
              reader.onerror = () =>
                reject(new Error("Failed to read file from disk."))
              reader.readAsArrayBuffer(audioFile)
            })
          } catch (e) {
            audioContext.close()
            throw e
          }

          let audioBuffer
          try {
            if (audioContext.state === "suspended") await audioContext.resume()
            audioBuffer = await audioContext.decodeAudioData(arrayBuffer)
          } catch (e) {
            console.warn(
              "Initial decode failed, attempting smart extraction...",
              e,
            )
            try {
              const offset = getAudioDataOffset(arrayBuffer)

              if (offset === -1) {
                throw new Error("No valid MP3 frames found.")
              }

              const cleanBuffer =
                offset === 0 ? arrayBuffer : arrayBuffer.slice(offset)
              audioBuffer = await audioContext.decodeAudioData(cleanBuffer)
            } catch (e2) {
              audioContext.close()
              throw new Error(
                `Unable to decode. The file may be corrupted, or it's unsupported and can't be played in browser`,
              )
            }
          }

          if (!audioBuffer || audioBuffer.duration <= 0.1) {
            audioContext.close()
            throw new Error(
              "Audio file is empty, silent, or has zero duration.",
            )
          }

          const STEP_MS = 25
          const samplesPerPulse = Math.floor(
            (audioBuffer.sampleRate * STEP_MS) / 1000,
          )
          const totalPulses = Math.floor(
            audioBuffer.duration * (1000 / STEP_MS),
          )
          const leftCh = audioBuffer.getChannelData(0)
          const rightCh =
            audioBuffer.numberOfChannels > 1
              ? audioBuffer.getChannelData(1)
              : leftCh

          const rawAmpsA = [],
            rawAmpsB = [],
            rawFreqsA = [],
            rawFreqsB = []

          const NOISE_THRESHOLD = 0.02

          const cutoffFreq = 150
          const RC = 1.0 / (2.0 * Math.PI * cutoffFreq)
          const dt = 1.0 / audioBuffer.sampleRate
          const alpha = dt / (RC + dt)

          let lastFilteredL = 0,
            lastFilteredR = 0

          for (let p = 0; p < totalPulses; p++) {
            const s = p * samplesPerPulse
            const e = Math.min(s + samplesPerPulse, leftCh.length)
            if (e - s < 10) break

            let sumSqA = 0,
              sumSqB = 0
            let crossA = 0,
              crossB = 0

            let prevFilteredL = lastFilteredL
            let prevFilteredR = lastFilteredR

            for (let i = s; i < e; i++) {
              const rawL = leftCh[i]
              const rawR = rightCh[i]

              sumSqA += rawL * rawL
              sumSqB += rawR * rawR

              const filteredL = lastFilteredL + alpha * (rawL - lastFilteredL)
              const filteredR = lastFilteredR + alpha * (rawR - lastFilteredR)
              lastFilteredL = filteredL
              lastFilteredR = filteredR

              if (
                (prevFilteredL <= 0 && filteredL > 0) ||
                (prevFilteredL >= 0 && filteredL < 0)
              )
                crossA++
              if (
                (prevFilteredR <= 0 && filteredR > 0) ||
                (prevFilteredR >= 0 && filteredR < 0)
              )
                crossB++

              prevFilteredL = filteredL
              prevFilteredR = filteredR
            }

            const ampA = Math.sqrt(sumSqA / (e - s))
            const ampB = Math.sqrt(sumSqB / (e - s))

            const timeSec = (e - s) / audioBuffer.sampleRate

            let freqA = 0,
              freqB = 0
            if (ampA > NOISE_THRESHOLD) freqA = crossA / timeSec / 2
            if (ampB > NOISE_THRESHOLD) freqB = crossB / timeSec / 2

            rawAmpsA.push(ampA)
            rawAmpsB.push(ampB)
            rawFreqsA.push(freqA)
            rawFreqsB.push(freqB)

            if (p % 500 === 0) await new Promise((r) => setTimeout(r, 0))
          }

          audioContext.close()

          const p99 = (arr) => {
            if (arr.length === 0) return 0.001
            const sorted = [...arr].sort((a, b) => a - b)
            return sorted[Math.floor(arr.length * 0.99)] || 0.001
          }

          const maxAmpA = p99(rawAmpsA)
          const maxAmpB = p99(rawAmpsB)

          const freqFloor = 20
          const rawFreqsANormalized = rawFreqsA.map((f) =>
            Math.max(0, f - freqFloor),
          )
          const rawFreqsBNormalized = rawFreqsB.map((f) =>
            Math.max(0, f - freqFloor),
          )

          const maxFreqA = Math.max(p99(rawFreqsANormalized), 10)
          const maxFreqB = Math.max(p99(rawFreqsBNormalized), 10)

          const clamp = (v, mn, mx) => Math.max(mn, Math.min(mx, v))

          const header = new TextEncoder().encode("YEAHBOI!")
          const buf = new ArrayBuffer(8 + rawAmpsA.length * 16)
          const view = new DataView(buf)
          for (let i = 0; i < 8; i++) view.setUint8(i, header[i])

          for (let i = 0; i < rawAmpsA.length; i++) {
            const o = 8 + i * 16
            view.setFloat32(o, clamp(rawAmpsA[i] / maxAmpA, 0, 1), true)
            view.setFloat32(o + 4, clamp(rawAmpsB[i] / maxAmpB, 0, 1), true)
            view.setFloat32(
              o + 8,
              clamp(rawFreqsANormalized[i] / maxFreqA, 0, 1),
              true,
            )
            view.setFloat32(
              o + 12,
              clamp(rawFreqsBNormalized[i] / maxFreqB, 0, 1),
              true,
            )
            if (i % 500 === 0) await new Promise((r) => setTimeout(r, 0))
          }

          return { buffer: buf }
        }

        // --- Accurate MP3 Converter ---
        async function convertAudioToHWL_Accurate(audioFile) {
          const audioContext = new (
            window.AudioContext || window.webkitAudioContext
          )()
          let arrayBuffer = await new Promise((resolve, reject) => {
            const reader = new FileReader()
            reader.onload = () => resolve(reader.result)
            reader.onerror = () => reject(new Error("Failed to read file."))
            reader.readAsArrayBuffer(audioFile)
          })

          let audioBuffer
          try {
            if (audioContext.state === "suspended") await audioContext.resume()
            audioBuffer = await audioContext.decodeAudioData(arrayBuffer)
          } catch (e) {
            audioContext.close()
            throw new Error("Unable to decode audio data.")
          }

          // Downsample to 16000Hz to make pitch detection feasible in JS
          const targetSampleRate = 16000
          const ratio = audioBuffer.sampleRate / targetSampleRate
          const originalLeft = audioBuffer.getChannelData(0)
          const originalRight =
            audioBuffer.numberOfChannels > 1
              ? audioBuffer.getChannelData(1)
              : originalLeft

          const newLength = Math.floor(originalLeft.length / ratio)
          const leftCh = new Float32Array(newLength)
          const rightCh = new Float32Array(newLength)

          for (let i = 0; i < newLength; i++) {
            leftCh[i] = originalLeft[Math.floor(i * ratio)]
            rightCh[i] = originalRight[Math.floor(i * ratio)]
          }

          const STEP_MS = 25
          const samplesPerPulse = Math.floor(
            (targetSampleRate * STEP_MS) / 1000,
          )
          const totalPulses = Math.floor(newLength / samplesPerPulse)

          const rawAmpsA = [],
            rawAmpsB = [],
            rawFreqsA = [],
            rawFreqsB = []
          const NOISE_THRESHOLD = 0.01

          function detectPitch(samples) {
            const n = samples.length
            let bestTau = -1
            let minDiff = Infinity

            const minLag = 20
            const maxLag = Math.min(320, Math.floor(n / 2))

            for (let tau = minLag; tau <= maxLag; tau++) {
              let diff = 0
              for (let i = 0; i < n / 2; i++) {
                const delta = samples[i] - samples[i + tau]
                diff += delta * delta
              }
              if (diff < minDiff) {
                minDiff = diff
                bestTau = tau
              }
            }

            if (bestTau > 0) return targetSampleRate / bestTau
            return 0
          }

          for (let p = 0; p < totalPulses; p++) {
            const s = p * samplesPerPulse
            const e = s + samplesPerPulse

            let sumSqA = 0,
              sumSqB = 0
            const windowL = leftCh.subarray(s, e)
            const windowR = rightCh.subarray(s, e)

            for (let i = 0; i < samplesPerPulse; i++) {
              sumSqA += windowL[i] * windowL[i]
              sumSqB += windowR[i] * windowR[i]
            }

            const ampA = Math.sqrt(sumSqA / samplesPerPulse)
            const ampB = Math.sqrt(sumSqB / samplesPerPulse)

            let freqA = 0,
              freqB = 0
            if (ampA > NOISE_THRESHOLD) freqA = detectPitch(windowL)
            if (ampB > NOISE_THRESHOLD) freqB = detectPitch(windowR)

            rawAmpsA.push(ampA)
            rawAmpsB.push(ampB)
            rawFreqsA.push(freqA)
            rawFreqsB.push(freqB)

            if (p % 200 === 0) {
              const progress = Math.round((p / totalPulses) * 100)
              popupTitle.textContent = `Converting MP3 (Accurate)... ${progress}%`
              await new Promise((r) => setTimeout(r, 0))
            }
          }

          audioContext.close()

          const p995 = (arr) => {
            if (arr.length === 0) return 0.001
            const sorted = [...arr].sort((a, b) => a - b)
            return sorted[Math.floor(arr.length * 0.995)] || 0.001
          }

          const maxAmpA = p995(rawAmpsA)
          const maxAmpB = p995(rawAmpsB)

          const validFreqsA = rawFreqsA.filter((f) => f > 50)
          const validFreqsB = rawFreqsB.filter((f) => f > 50)
          const maxFreqA = Math.max(
            p995(validFreqsA.length ? validFreqsA : [200]),
            200,
          )
          const maxFreqB = Math.max(
            p995(validFreqsB.length ? validFreqsB : [200]),
            200,
          )

          const clamp = (v, mn, mx) => Math.max(mn, Math.min(mx, v))
          const header = new TextEncoder().encode("YEAHBOI!")
          const buf = new ArrayBuffer(8 + rawAmpsA.length * 16)
          const view = new DataView(buf)
          for (let i = 0; i < 8; i++) view.setUint8(i, header[i])

          for (let i = 0; i < rawAmpsA.length; i++) {
            const o = 8 + i * 16
            view.setFloat32(o, clamp(rawAmpsA[i] / maxAmpA, 0, 1), true)
            view.setFloat32(o + 4, clamp(rawAmpsB[i] / maxAmpB, 0, 1), true)
            view.setFloat32(o + 8, clamp(rawFreqsA[i] / maxFreqA, 0, 1), true)
            view.setFloat32(o + 12, clamp(rawFreqsB[i] / maxFreqB, 0, 1), true)
          }

          return { buffer: buf }
        }

        async function handleMp3ImportAccurate(file) {
          showConversionPopup("Converting MP3 (Accurate)... 0%")
          await new Promise((r) => setTimeout(r, 50))

          try {
            const { buffer } = await convertAudioToHWL_Accurate(file)
            const res = parseHWL(buffer)
            if (!res) {
              alert("Failed to parse generated HWL data.")
              return
            }
            ;["A", "B"].forEach((c) => {
              setChannelData(
                c,
                "hwlPos",
                simplify(res[c].hwlPos, state.options.tolerance),
              )
              setChannelData(
                c,
                "hwlFreq",
                simplify(res[c].hwlFreq, state.options.tolerance),
              )
            })
            state.files.hwl = file.name + " (Accurate)"
            state.files.hwlBase = file.name.replace(/\.[^/.]+$/, "")
            document.getElementById("lbl-hwl").textContent =
              file.name + " (Accurate)"
            updateMaxTime()
            render()
          } catch (e) {
            alert("Conversion failed: " + e.message)
          } finally {
            hideConversionPopup()
          }
        }

        async function handleMp3Import(file) {
          showConversionPopup("Converting MP3 to HWL...")
          await new Promise((r) => setTimeout(r, 50))

          try {
            const { buffer } = await convertAudioToHWL(file)
            const res = parseHWL(buffer)
            if (!res) {
              alert("Failed to parse generated HWL data.")
              return
            }
            ;["A", "B"].forEach((c) => {
              setChannelData(
                c,
                "hwlPos",
                simplify(res[c].hwlPos, state.options.tolerance),
              )
              setChannelData(
                c,
                "hwlFreq",
                simplify(res[c].hwlFreq, state.options.tolerance),
              )
            })
            state.files.hwl = file.name
            state.files.hwlBase = file.name.replace(/\.[^/.]+$/, "")
            document.getElementById("lbl-hwl").textContent = file.name
            updateMaxTime()
            render()
          } catch (e) {
            alert("Conversion failed: " + e.message)
          } finally {
            hideConversionPopup()
          }
        }

        // Initialize UI & events
        function init() {
          document.getElementById("btn-points").onclick = function () {
            state.showPoints = !state.showPoints
            this.classList.toggle("active")
            render()
          }
          document.getElementById("btn-zin").onclick = () => {
            zoomAt(1.4, 0.5, els.canvasA.clientWidth)
            render()
          }
          document.getElementById("btn-zout").onclick = () => {
            zoomAt(1 / 1.4, 0.5, els.canvasA.clientWidth)
            render()
          }
          els.timeline.oninput = () => {
            updateTime()
            if (state.maxTime <= 0) return
            const w = els.canvasA.width / (window.devicePixelRatio || 1)
            const marginPx = w * 0.1
            const visW = w * state.zoom
            const sR = Math.max(1, visW - w + marginPx * 2)
            const scX = visW / state.maxTime
            const tStart = (els.timeline.value / 10000) * state.maxTime
            const sX = tStart * scX
            state.scrollX = Math.max(0, Math.min(1, (sX + marginPx) / sR))
            render()
          }
          ;["A", "B"].forEach((ck) => {
            const wr = document.getElementById(`wrap-${ck.toLowerCase()}`)
            wr.addEventListener("mousedown", (e) => {
              if (e.button !== 0) return
              const d = { sx: e.clientX, sc: state.scrollX }
              const m = (ev) => {
                const w = wr.clientWidth
                const marginPx = w * 0.1
                const visW = w * state.zoom
                const sR = Math.max(1, visW - w + marginPx * 2)
                state.scrollX = Math.max(
                  0,
                  Math.min(1, d.sc - (ev.clientX - d.sx) / sR),
                )
                updateTimelineFromScroll()
                render()
              }
              const u = () => {
                document.removeEventListener("mousemove", m)
                document.removeEventListener("mouseup", u)
              }
              document.addEventListener("mousemove", m)
              document.addEventListener("mouseup", u)
            })
            wr.addEventListener(
              "wheel",
              (e) => {
                e.preventDefault()
                const rect = wr.getBoundingClientRect(),
                  mouseRatio = (e.clientX - rect.left) / rect.width
                const dir = e.deltaY < 0 ? 1 : -1,
                  dynMul = Math.max(0.05, 0.3 / Math.sqrt(state.zoom))
                zoomAt(1 + dir * dynMul, mouseRatio, rect.width)
                render()
              },
              { passive: false },
            )
          })
          ;["A", "B"].forEach(initLayers)
          document.querySelectorAll(".btn-import").forEach((b) => {
            if (b.id === "btn-imp-mp3") return
            b.addEventListener("click", (e) => {
              const i = document.getElementById(b.dataset.target)
              if (i) i.click()
            })
          })

          // MP3 Import handling
          document
            .getElementById("btn-imp-mp3")
            .addEventListener("click", () => {
              document.getElementById("f-mp3").click()
            })
          document.getElementById("f-mp3").addEventListener("change", (e) => {
            if (e.target.files[0]) {
              handleMp3Import(e.target.files[0])
              e.target.value = ""
            }
          })

          // Accurate MP3 Import handling
          document
            .getElementById("btn-imp-mp3-acc")
            .addEventListener("click", () => {
              document.getElementById("f-mp3-acc").click()
            })
          document
            .getElementById("f-mp3-acc")
            .addEventListener("change", (e) => {
              if (e.target.files[0]) {
                handleMp3ImportAccurate(e.target.files[0])
                e.target.value = ""
              }
            })

          const bf = (id, t, c, k) => {
            const i = document.getElementById(id)
            if (i)
              i.addEventListener("change", (e) => {
                if (e.target.files[0]) loadFile(t, e.target.files[0], c, k)
                e.target.value = ""
              })
          }
          bf("f-hwl", "hwl")
          bf("f-fsA-pos", "fs", "A", "fsPos")
          bf("f-fsA-freq", "fs", "A", "fsFreq")
          bf("f-fsB-pos", "fs", "B", "fsPos")
          bf("f-fsB-freq", "fs", "B", "fsFreq")

          const so = (id, fn) => {
            const el = document.getElementById(id)
            if (el) el.addEventListener("click", fn)
          }
          so("btn-exp-hwl", exportHWL)
          so("btn-exp-fsA-pos", () => exportFS("A", "fsPos"))
          so("btn-exp-fsA-freq", () => exportFS("A", "fsFreq"))
          so("btn-exp-fsB-pos", () => exportFS("B", "fsPos"))
          so("btn-exp-fsB-freq", () => exportFS("B", "fsFreq"))

          const simpFn = (c, k) => {
            setChannelData(
              c,
              k,
              simplify(
                state.channels[c].channelData[k],
                state.options.tolerance,
              ),
            )
            render()
          }
          so("btn-simp-fsA-pos", () => simpFn("A", "fsPos"))
          so("btn-simp-fsA-freq", () => simpFn("A", "fsFreq"))
          so("btn-simp-fsB-pos", () => simpFn("B", "fsPos"))
          so("btn-simp-fsB-freq", () => simpFn("B", "fsFreq"))

          const fillFn = (c, k) => {
            setChannelData(c, k, fillCurve(state.channels[c].channelData[k]))
            render()
          }
          so("btn-fill-fsA-pos", () => fillFn("A", "fsPos"))
          so("btn-fill-fsA-freq", () => fillFn("A", "fsFreq"))
          so("btn-fill-fsB-pos", () => fillFn("B", "fsPos"))
          so("btn-fill-fsB-freq", () => fillFn("B", "fsFreq"))

          so("btn-inv-fsA-pos", () => {
            const d = state.channels.A.channelData.fsPos
            if (!d?.length) return alert("No data to invert")
            setChannelData("A", "fsPos", invertScript(d))
            render()
          })

          so("btn-inv-fsA-freq", () => {
            const d = state.channels.A.channelData.fsFreq
            if (!d?.length) return alert("No data to invert")
            setChannelData("A", "fsFreq", invertScript(d))
            render()
          })

          so("btn-inv-fsB-pos", () => {
            const d = state.channels.B.channelData.fsPos
            if (!d?.length) return alert("No data to invert")
            setChannelData("B", "fsPos", invertScript(d))
            render()
          })

          so("btn-inv-fsB-freq", () => {
            const d = state.channels.B.channelData.fsFreq
            if (!d?.length) return alert("No data to invert")
            setChannelData("B", "fsFreq", invertScript(d))
            render()
          })

          const sf = (c, k, v) => {
            const d = state.channels[c].channelData[k]
            if (d) d.forEach((p) => (p.pos = v))
            setChannelData(c, k, d)
            render()
          }
          so("btn-f0-fsA", () => sf("A", "fsFreq", 0))
          so("btn-f50-fsA", () => sf("A", "fsFreq", 50))
          so("btn-f100-fsA", () => sf("A", "fsFreq", 100))
          so("btn-f0-fsB", () => sf("B", "fsFreq", 0))
          so("btn-f50-fsB", () => sf("B", "fsFreq", 50))
          so("btn-f100-fsB", () => sf("B", "fsFreq", 100))

          const gf = (c, pk, fk) => {
            const pos = state.channels[c].channelData[pk]
            if (!pos?.length) return
            setChannelData(c, fk, generateFrequencyFromPosition(pos))
            render()
          }
          so("btn-gen-fsA-freq", () => gf("A", "fsPos", "fsFreq"))
          so("btn-gen-fsB-freq", () => gf("B", "fsPos", "fsFreq"))

          const alHwl = document.getElementById("freq-algo-hwl")
          if (alHwl)
            alHwl.addEventListener(
              "change",
              (e) => (state.options.freqAlgoHwl = e.target.value),
            )

          so("btn-hwl-to-fs", () => {
            if (!state.maxTime) return alert("Import HWL first")
            ;["A", "B"].forEach((c) => {
              if (state.channels[c].channelData.hwlPos.length)
                setChannelData(
                  c,
                  "fsPos",
                  state.channels[c].channelData.hwlPos.map((p) => ({ ...p })),
                )
              if (state.channels[c].channelData.hwlFreq.length)
                setChannelData(
                  c,
                  "fsFreq",
                  state.channels[c].channelData.hwlFreq.map((p) => ({ ...p })),
                )
            })
            state.files.fsA_pos = "from HWL"
            state.files.fsB_pos = "from HWL"
            state.files.fsA_freq = "from HWL"
            state.files.fsB_freq = "from HWL"
            document.getElementById("lbl-fsA-pos").textContent = "from HWL"
            document.getElementById("lbl-fsB-pos").textContent = "from HWL"
            document.getElementById("lbl-fsA-freq").textContent = "from HWL"
            document.getElementById("lbl-fsB-freq").textContent = "from HWL"
            state.files.fsA_posBase = null
            state.files.fsB_posBase = null
            state.files.fsA_freqBase = null
            state.files.fsB_freqBase = null
            render()
          })

          so("btn-fs-to-hwl", generateHWLFromFS)

          so("btn-fsA-to-stroker", () => {
            const pos = state.channels.A.channelData.fsPos
            const freq = state.channels.A.channelData.fsFreq
            if (!pos?.length) return alert("Import funscript position first")
            setChannelData("A", "fsPos", adaptForStroker(pos, freq))
            render()
          })
          so("btn-fsB-to-stroker", () => {
            const pos = state.channels.B.channelData.fsPos
            const freq = state.channels.B.channelData.fsFreq
            if (!pos?.length) return alert("Import funscript position first")
            setChannelData("B", "fsPos", adaptForStroker(pos, freq))
            render()
          })
          so("btn-fsA-to-estim", () => {
            const pos = state.channels.A.channelData.fsPos
            if (!pos?.length) return alert("Import funscript position first")
            setChannelData("A", "fsPos", adaptForEstim(pos))
            render()
          })
          so("btn-fsB-to-estim", () => {
            const pos = state.channels.B.channelData.fsPos
            if (!pos?.length) return alert("Import funscript position first")
            setChannelData("B", "fsPos", adaptForEstim(pos))
            render()
          })

          updateButtonStates()

          window.addEventListener("resize", updateSizes)
          updateSizes()
        }

        if (document.readyState === "loading")
          document.addEventListener("DOMContentLoaded", init)
        else init()
      })()
    </script>
  </body>
</html>
